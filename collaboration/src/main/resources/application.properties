server.port=8085
spring.application.name=collaboration-service

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Database & HikariCP Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chat
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false

# JPA & Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=collaboration_public

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.default-schema=collaboration_public

# Microservice Observability
management.endpoints.web.exposure.include=health,info,prometheus

# MinIO Object Storage Configuration (Bedrock Framework Storage)
bedrock.storage.minio.endpoint=http://localhost:9000
bedrock.storage.minio.access-key=minioadmin
bedrock.storage.minio.secret-key=minioadmin
bedrock.storage.minio.bucket=chat-attachments

# File Upload Multipart Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# JODConverter / LibreOffice Document Conversion
jodconverter.remote.enabled=true
jodconverter.remote.url=http://localhost:8082
jodconverter.remote.socket-timeout=60000
jodconverter.remote.connect-timeout=5000
jodconverter.remote.pool-size=5

# Multi-Domain Delegated Chat Ticket Configuration (Section 4 - Static Configuration)
# chat.ticket.issuers[0].issuer=restaurant-service
