server.port=8085
spring.application.name=collaboration-service
spring.profiles.active=dev

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Database & HikariCP Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chat
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false

# JPA & Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=collaboration_public

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.default-schema=collaboration_public

# Microservice Observability
management.endpoints.web.exposure.include=health,info,prometheus

# MinIO Object Storage Configuration (Bedrock Framework Storage)
bedrock.storage.minio.endpoint=http://localhost:9000
bedrock.storage.minio.access-key=minioadmin
bedrock.storage.minio.secret-key=minioadmin
bedrock.storage.minio.bucket=chat-attachments

# File Upload Multipart Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# JODConverter / LibreOffice Document Conversion
jodconverter.remote.enabled=true
jodconverter.remote.url=http://localhost:8082
jodconverter.remote.socket-timeout=60000
jodconverter.remote.connect-timeout=5000
jodconverter.remote.pool-size=5

# Bedrock Authz Client Configuration (Disable local Authz JPA persistence & auto-configuration in Collaboration service)
authz.jpa.enabled=false
spring.autoconfigure.exclude=org.datamate.authz.starter.config.BedrockAuthzAutoConfiguration
authz.opa.evaluation-url=http://localhost:8181/v1/data/app/authz/%s/allow

# RabbitMQ Message Broker Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Collaboration System Events Messaging
collaboration.messaging.system-events.exchange=chat.system.events
collaboration.messaging.system-events.queue=chat.system.events.queue
collaboration.messaging.system-events.routing-key=chat.event.*

