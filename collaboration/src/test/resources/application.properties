# Test Database Configuration (In-Memory H2 in PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:collaboration_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS authz\\;CREATE SCHEMA IF NOT EXISTS audit
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
spring.flyway.enabled=false

# MinIO Test Properties
bedrock.storage.minio.endpoint=http://localhost:9000
bedrock.storage.minio.access-key=minioadmin
bedrock.storage.minio.secret-key=minioadmin
bedrock.storage.minio.bucket=chat-attachments
# JODConverter disabled in tests by default
jodconverter.remote.enabled=false

# Disable Authz JPA entity repository in collaboration service
authz.jpa.enabled=false

